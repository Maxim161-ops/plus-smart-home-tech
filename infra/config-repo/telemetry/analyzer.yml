spring:
  application:
    name: analyzer

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home
    username: smart_home
    password: smart_home
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

kafka:
  bootstrap-servers: localhost:9092

  consumers:
    hub-events:
      group-id: analyzer-hub-events
      auto-offset-reset: earliest
      enable-auto-commit: false

    snapshots:
      group-id: analyzer-snapshots
      auto-offset-reset: earliest
      enable-auto-commit: false

  topics:
    hub-events: telemetry.hubs.v1
    snapshots: telemetry.snapshots.v1

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

logging:
  level:
    ru.yandex.practicum.telemetry.analyzer: DEBUG