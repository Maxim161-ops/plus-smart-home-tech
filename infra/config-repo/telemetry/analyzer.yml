spring:
  application:
    name: analyzer

kafka:
  bootstrap-servers: localhost:9092

  spring:
    application:
      name: analyzer
    config:
      import: configserver:http://localhost:8888
    cloud:
      config:
        fail-fast: true
        retry:
          max-attempts: 6
          initial-interval: 1000
          multiplier: 1.1
          max-interval: 2000

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home
    username: smart_home
    password: smart_home
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  consumers:
    hub-events:
      group-id: analyzer-hub-events
      auto-offset-reset: earliest
      enable-auto-commit: false

    snapshots:
      group-id: analyzer-snapshots
      auto-offset-reset: earliest
      enable-auto-commit: false

  topics:
    hub-events: telemetry.hubs.v1
    snapshots: telemetry.snapshots.v1

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

logging:
  level:
    ru.yandex.practicum.telemetry.analyzer: DEBUG