spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home
    username: smart_home
    password: smart_home

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: shopping_cart

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000

          warehouse:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: BASIC

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    ru.yandex.practicum.commerce.interaction.client.WarehouseClient: DEBUG